version: '3'

vars:
  GO_BIN_DIR: apps/backend/bin
  POSTGRES_DSN: '{{.TUTORLINKNG_DB_DSN | default "postgres://postgres:postgres@localhost:5432/tutorlinkng?sslmode=disable"}}'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  # --- Infrastructure (Docker) ---
  up:
    desc: Start local dependencies (PostgreSQL, Redis, S3 Object Storage)
    cmds:
      - docker compose up -d
      - 'echo "PostgreSQL (5432), Redis (6379), S3 Object Storage (9090) are starting."'

  down:
    desc: Stop local dependencies
    cmds:
      - docker compose down

  logs:
    desc: View logs from docker compose services
    cmds:
      - docker compose logs -f

  # --- Development ---
  dev:
    desc: Start all services (infrastructure, migrations, backend API, and frontend)
    cmds:
      - task: up
      - task: db:migrate
      - task: dev:all

  dev:all:
    internal: true
    deps:
      - dev:api
      - dev:web

  dev:api:
    desc: Start Go Echo API server
    dir: apps/backend
    cmds:
      - go run ./cmd/tutorlinkng

  dev:worker:
    desc: Start Go cron runner
    dir: apps/backend
    cmds:
      - go run ./cmd/cron

  dev:web:
    desc: Start frontend dev server (Next.js)
    cmds:
      - bun run --filter frontend dev

  terminal:
    desc: Start interactive developer terminal & observability TUI
    cmds:
      - bun run terminal

  terminal:go:
    desc: Start Go-native developer terminal & observability TUI
    dir: apps/backend
    cmds:
      - go run ./cmd/tui

  # --- Database (Tern) ---
  db:status:
    desc: Check database migration status
    dir: apps/backend
    cmds:
      - tern status -m ./internal/database/migrations --conn-string "{{.POSTGRES_DSN}}"

  db:migrate:
    desc: Apply pending Tern database migrations
    dir: apps/backend
    cmds:
      - tern migrate -m ./internal/database/migrations --conn-string "{{.POSTGRES_DSN}}"

  db:new:
    desc: Create a new database migration (e.g. task db:new name=migration_name)
    dir: apps/backend
    vars:
      NAME: '{{.name | default ""}}'
    cmds:
      - tern new -m ./internal/database/migrations {{.NAME}}

  # --- Contracts & Code Generation ---
  openapi:generate:
    desc: Generate OpenAPI spec from TypeScript contracts
    cmds:
      - bun run --filter @tutorlinkng/openapi gen

  # --- Email Templates ---
  email:dev:
    desc: Start React Email live preview server
    cmds:
      - bun run --filter @tutorlinkng/emails dev

  email:export:
    desc: Export React Email templates to Go templates directory
    cmds:
      - bun run --filter @tutorlinkng/emails export

  # --- Quality & Testing ---
  test:
    desc: Run all tests (Go and Frontend)
    cmds:
      - task: test:go
      - task: test:web

  test:go:
    desc: Run Go unit and domain tests
    dir: apps/backend
    cmds:
      - go test -race -v ./...

  test:web:
    desc: Run frontend unit tests
    cmds:
      - bun run --filter frontend test

  lint:
    desc: Run linters across Go and TypeScript
    cmds:
      - bun run lint
      - task: lint:go

  lint:go:
    desc: Run Go vetting
    dir: apps/backend
    cmds:
      - go vet ./...

  check:
    desc: Run all validation checks (format, lint, tests, builds)
    cmds:
      - bun run typecheck
      - task: lint
      - task: test
      - task: build

  build:
    desc: Build frontend and backend binaries
    cmds:
      - bun run build
      - task: build:go

  build:go:
    desc: Build Go binaries for tutorlinkng, cron, and tui
    dir: apps/backend
    cmds:
      - go build -o bin/tutorlinkng.exe ./cmd/tutorlinkng
      - go build -o bin/cron.exe ./cmd/cron
      - go build -o bin/tui.exe ./cmd/tui
