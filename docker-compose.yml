name: tutorlinkng

services:
  postgres:
    image: postgres:16-alpine
    container_name: tutorlinkng-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tutorlinkng
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tutorlinkng"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tutorlinkng-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3:
    image: adobe/s3mock:latest
    container_name: tutorlinkng-s3
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      initialBuckets: "tutorlinkng-bucket"
    volumes:
      - s3_data:/storage

volumes:
  postgres_data:
  redis_data:
  s3_data:
